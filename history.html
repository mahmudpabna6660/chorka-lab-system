<script>
"use strict";

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
    "https://qvexepszsqrjgjvobuju.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_6VkM2ZGMwx9vpyLPX33llg_GC7elJ7f";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const REPORT_TABLE = "shade_reports";
const EVIDENCE_TABLE = "shade_report_evidence";
const STORAGE_BUCKET = "shade-evidence";

let allReports = [];
let filteredReports = [];
let loadingReports = false;

const $ = id => document.getElementById(id);


/* =========================================
   GENERAL HELPERS
========================================= */

function setStatus(message, isError = false) {
    const el = $("statusMessage");

    el.textContent = message || "";
    el.style.color = isError ? "#b91c1c" : "#64748b";
}

function safeText(value, fallback = "—") {
    if (value === null || value === undefined) {
        return fallback;
    }

    const result = String(value).trim();

    return result === "" ? fallback : result;
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function normalize(value) {
    return String(value ?? "")
        .toLowerCase()
        .trim();
}

function getReportDate(report) {
    return report.update_datetime || report.created_at || "";
}

function formatDateTime(value) {
    if (!value) return "—";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return safeText(value);
    }

    return new Intl.DateTimeFormat("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    }).format(date);
}

function getUpdatedBy(report) {
    return report.updated_by_other ||
           report.updated_by ||
           "";
}

function getRemarks(report) {
    return report.notes ||
           report.remarks ||
           "";
}

function getCustomer(report) {
    return report.customer_name ||
           report.customer ||
           "";
}

function getPI(report) {
    return report.pi_no ||
           report.pi ||
           report.po_no ||
           report.po ||
           "";
}

function getShade(report) {
    return report.shade ||
           report.shade_name ||
           report.color ||
           report.colour ||
           "";
}

function getReportNumber(report) {
    return report.report_no ||
           report.id ||
           "";
}

function getSource(report) {
    return report.update_source ||
           report.source ||
           "";
}


/* =========================================
   AUTHENTICATION
========================================= */

async function checkLogin() {
    const { data, error } = await db.auth.getSession();

    if (error) {
        throw error;
    }

    if (!data.session) {
        window.location.replace("./index.html");
        return false;
    }

    return true;
}


/* =========================================
   LOAD REPORTS
========================================= */

async function loadReports() {
    if (loadingReports) return;

    loadingReports = true;

    $("reportList").innerHTML =
        '<div class="loading">রিপোর্ট লোড হচ্ছে...</div>';

    setStatus("ডাটাবেস থেকে রিপোর্ট আনা হচ্ছে...");

    try {
        const { data, error } = await db
            .from(REPORT_TABLE)
            .select("*")
            .order("created_at", { ascending: false });

        if (error) {
            throw error;
        }

        allReports = data || [];

        $("totalReports").textContent =
            allReports.length.toLocaleString("en-US");

        applyFilters();

        setStatus(
            allReports.length
                ? "রিপোর্ট সফলভাবে লোড হয়েছে।"
                : "এখনো কোনো রিপোর্ট পাওয়া যায়নি।"
        );

    } catch (error) {
        console.error("Load reports error:", error);

        $("reportList").innerHTML =
            '<div class="no-data">' +
            'রিপোর্ট লোড করতে সমস্যা হয়েছে:<br><br>' +
            escapeHTML(error.message || "Unknown error") +
            '</div>';

        setStatus(
            "রিপোর্ট লোড করতে সমস্যা হয়েছে: " +
            (error.message || "Unknown error"),
            true
        );

    } finally {
        loadingReports = false;
    }
}


/* =========================================
   ADVANCED SEARCH FILTERS
========================================= */

function applyFilters() {

    const customer = normalize(
        $("customerFilter").value
    );

    const pi = normalize(
        $("piFilter").value
    );

    const shade = normalize(
        $("shadeFilter").value
    );

    const source = normalize(
        $("sourceFilter").value
    );

    const from = $("fromDate").value;
    const to = $("toDate").value;


    // Validate date range

    if (from && to && from > to) {
        setStatus(
            "তারিখ সঠিক নয়। শুরুর তারিখ শেষ তারিখের আগে দিন।",
            true
        );

        $("shownReports").textContent = "0";

        $("reportList").innerHTML =
            '<div class="no-data">' +
            'Date Range সঠিক নয়। তারিখ পরিবর্তন করুন।' +
            '</div>';

        filteredReports = [];

        return;
    }


    filteredReports = allReports.filter(report => {

        // Customer Search

        const reportCustomer = normalize(
            getCustomer(report)
        );

        if (
            customer &&
            !reportCustomer.includes(customer)
        ) {
            return false;
        }


        // PI Search

        const reportPI = normalize(
            getPI(report)
        );

        if (
            pi &&
            !reportPI.includes(pi)
        ) {
            return false;
        }


        // Shade Search

        const reportShade = normalize(
            getShade(report)
        );

        if (
            shade &&
            !reportShade.includes(shade)
        ) {
            return false;
        }


        // Update Source Search

        const reportSource = normalize(
            getSource(report)
        );

        if (
            source &&
            !reportSource.includes(source)
        ) {
            return false;
        }


        // Date Range Search

        const rawDate = getReportDate(report);

        const reportDate = rawDate
            ? String(rawDate).slice(0, 10)
            : "";

        if (
            from &&
            (!reportDate || reportDate < from)
        ) {
            return false;
        }

        if (
            to &&
            (!reportDate || reportDate > to)
        ) {
            return false;
        }

        return true;
    });


    $("shownReports").textContent =
        filteredReports.length.toLocaleString("en-US");

    renderReports();
}


/* =========================================
   EVIDENCE PHOTOS
========================================= */

async function getEvidence(report) {

    if (report._evidenceLoaded) {
        return report._evidence || [];
    }

    if (!report.id) {
        report._evidence = [];
        report._evidenceLoaded = true;

        return [];
    }

    const { data, error } = await db
        .from(EVIDENCE_TABLE)
        .select("*")
        .eq("report_id", report.id)
        .order("created_at", { ascending: true });

    if (error) {
        throw error;
    }

    const evidence = [];

    for (const item of (data || [])) {

        let imageURL = "";

        const storagePath =
            item.storage_path ||
            item.file_path ||
            item.path ||
            "";

        if (storagePath) {

            const {
                data: signedData,
                error: signedError
            } = await db.storage
                .from(STORAGE_BUCKET)
                .createSignedUrl(storagePath, 3600);

            if (!signedError && signedData) {
                imageURL = signedData.signedUrl;
            }
        }

        evidence.push({
            ...item,
            imageURL
        });
    }

    report._evidence = evidence;
    report._evidenceLoaded = true;

    return evidence;
}


/* =========================================
   REPORT CARD HELPERS
========================================= */

function reportField(label, value) {
    return `
        <div class="info-item">
            <div class="info-label">
                ${escapeHTML(label)}
            </div>

            <div class="info-value">
                ${escapeHTML(safeText(value))}
            </div>
        </div>
    `;
}

                        ${

                                safeText(
                                    getCustomer(report),
                                    "Customer Not Specified"
                                )
                            )
                        }
                    </div>

                    <div class="report-meta">
                        PI: ${
                            escapeHTML(safeText(getPI(report)))
                        }
                        ·
                        ${
                            escapeHTML(
                                formatDateTime(getReportDate(report))
                            )
                        }
                    </div>

                </div>

                <div class="report-body">

                    <div class="info-grid">

                        ${reportField(

                        ${reportField(
                            "PI No.",
                            getPI(report)
                        )}

                        ${reportField(
                            "Shade / Color",
                            getShade(report)
                        )}

                        ${reportField(

                            getUpdatedBy(report)
                        )}

                        ${reportField(
                            "Update Source",
                            getSource(report)
                        )}

                        ${reportField(
                            "Swatch Received",
                            formatDateTime(
                                report.swatch_received_datetime

                        )}

                            "Pending Colors",
                            report.pending_color_count

                        ${reportField(
                            "Running Colors",
                            report.running_color_count

                                    )

                            }

/* =========================================
   DISPLAY EVIDENCE PHOTOS
========================================= */

async function loadEvidenceForCard(report) {

    const cardId = String(report.id ?? "");
    const target = $("evidence-" + cardId);

    if (!target) return;

    try {

        const evidence = await getEvidence(report);

        const currentTarget = $("evidence-" + cardId);

        if (!currentTarget) return;

        if (!evidence.length) {

            currentTarget.innerHTML =
                '<div class="status-message">' +
                'এই রিপোর্টে কোনো ছবি সংযুক্ত নেই।' +
                '</div>';

            return;
        }

        currentTarget.innerHTML = `
            <div class="evidence-grid">

                ${evidence.map(item => `
                    <div class="evidence-item">

                        ${
                            item.imageURL
                            ? `
                                <a
                                    href="${escapeHTML(item.imageURL)}"
                                    target="_blank"
                                    rel="noopener"
                                >
                                    <img
                                        src="${escapeHTML(item.imageURL)}"
                                        alt="Evidence photo"
                                        loading="lazy"
                                    >
                                </a>
                            `
                            : `
                                <div class="status-message">
                                    ছবি খোলা যায়নি
                                </div>
                            `
                        }

                        <div class="evidence-caption">
                            ${
                                escapeHTML(
                                    safeText(item.source, "Evidence")
                                )
                            }

                            <br>

                            ${
                                escapeHTML(
                                    safeText(item.file_name, "")
                                )
                            }
                        </div>

                    </div>
                `).join("")}

            </div>
        `;

    } catch (error) {

        console.error("Evidence load error:", error);

        const currentTarget = $("evidence-" + cardId);

        if (currentTarget) {
            currentTarget.innerHTML =
                '<div class="status-message">' +
                'ছবি লোড করা যায়নি।' +
                '</div>';
        }
    }
}


/* =========================================
   PDF HELPERS
========================================= */

function pdfField(label, value) {

    return `
        <div class="pdf-field">

            <div class="pdf-field-label">
                ${escapeHTML(label)}
            </div>

            <div class="pdf-field-value">
                ${escapeHTML(safeText(value))}
            </div>

        </div>
    `;
}


function createPDFPage(title, subtitle = "") {

    const page = document.createElement("div");

    page.className = "pdf-page";

    page.innerHTML = `
        <div class="pdf-header">

            <div class="pdf-company">
                CHORKA TEXTILE LTD.
            </div>

            <div class="pdf-subtitle">
                Laboratory · Yarn Dyeing · Shade Update Management
            </div>

            <div class="pdf-doc-title">
                ${escapeHTML(title)}
            </div>

            <div class="pdf-doc-subtitle">
                ${escapeHTML(subtitle)}
            </div>

        </div>

        <div class="pdf-content"></div>

        <div class="pdf-footer">

            <span>
                CHORKA TEXTILE LTD. · LABORATORY
            </span>

            <span class="pdf-page-label"></span>

        </div>
    `;

    $("pdfWorkspace").appendChild(page);

    return page;
}


function setPDFPageNumber(page, number, total) {

    const label = page.querySelector(".pdf-page-label");

    if (label) {
        label.textContent =
            `PAGE ${number} OF ${total}`;
    }
}


function makeEvidenceCard(item, index) {

    const card = document.createElement("div");

    card.className = "pdf-evidence-card";

    const img = document.createElement("img");

    img.alt = "Evidence " + (index + 1);
    img.src = item.imageURL || "";

    const caption = document.createElement("div");

    caption.className = "pdf-evidence-caption";

    caption.textContent =
        (item.source || "Evidence") +
        (item.file_name ? " · " + item.file_name : "");

    card.appendChild(img);
    card.appendChild(caption);

    return card;
}


function waitForImage(img) {

    if (img.complete && img.naturalWidth > 0) {
        return Promise.resolve();
    }

    return new Promise(resolve => {

        img.onload = resolve;
        img.onerror = resolve;

        setTimeout(resolve, 5000);
    });
}


/* =========================================
   BUILD PDF PAGES
========================================= */

async function buildPDFPages(report) {

    const workspace = $("pdfWorkspace");

    workspace.innerHTML = "";

    const evidence = await getEvidence(report);

    const customer = safeText(
        getCustomer(report),
        "Customer"
    );

    const pi = safeText(
        getPI(report),
        "No PI"
    );

    const shade = safeText(
        getShade(report),
        "No Shade"
    );


    // First page: report details

    const firstPage = createPDFPage(
        "SHADE UPDATE REPORT",
        `Customer: ${customer} | PI No: ${pi}`
    );

    firstPage.querySelector(".pdf-content").innerHTML = `

        <section class="pdf-section">

            <div class="pdf-section-title">
                REPORT INFORMATION
            </div>

            <div class="pdf-grid">

                ${pdfField(
                    "Report No.",
                    getReportNumber(report)
                )}

                ${pdfField(
                    "Customer",
                    getCustomer(report)
                )}

                ${pdfField(
                    "PI No.",
                    getPI(report)
                )}

                ${pdfField(
                    "Shade / Color",
                    getShade(report)
                )}

                ${pdfField(
                    "Updated By",
                    getUpdatedBy(report)
                )}

                ${pdfField(
                    "Update Source",
                    getSource(report)
                )}

                ${pdfField(
                    "Update Date & Time",
                    formatDateTime(getReportDate(report))
                )}

                ${pdfField(
                    "Swatch Received",
                    formatDateTime(
                        report.swatch_received_datetime
                    )
                )}

            </div>

        </section>

        <section class="pdf-section">

            <div class="pdf-section-title">
                STATUS SUMMARY
            </div>

            <div class="pdf-grid">

                ${pdfField(
                    "Pending Colors",
                    report.pending_color_count
                )}

                ${pdfField(
                    "Running Colors",
                    report.running_color_count
                )}

                ${pdfField(
                    "Shade / Color",
                    shade
                )}

                ${pdfField(
                    "PI No.",
                    pi
                )}

            </div>

        </section>

        <section class="pdf-section">

            <div class="pdf-section-title">
                REMARKS / UPDATE NOTES
            </div>

            <div class="pdf-remarks">
                ${
                    escapeHTML(
                        safeText(
                            getRemarks(report),
                            "No remarks provided."
                        )
                    )
                }
            </div>

        </section>

        <section class="pdf-section">

            <div class="pdf-section-title">
                EVIDENCE SUMMARY
            </div>

            <div class="pdf-remarks">
                Total evidence photos: ${evidence.length}

                <br>

                Report generated:
                ${
                    escapeHTML(
                        formatDateTime(new Date().toISOString())
                    )
                }
            </div>

        </section>

    `;


    // Evidence pages

    const validEvidence = evidence.filter(
        item => item.imageURL
    );


    if (!validEvidence.length) {

        const page = createPDFPage(
            "EVIDENCE PHOTOS",
            `Customer: ${customer} | PI No: ${pi}`
        );

        page.querySelector(".pdf-content").innerHTML = `

            <section class="pdf-section">

                <div class="pdf-section-title">
                    SWATCH & EVIDENCE PHOTOS
                </div>

                <div class="pdf-empty">
                    এই রিপোর্টে কোনো evidence photo পাওয়া যায়নি।
                </div>

            </section>

        `;

    } else {

        for (
            let i = 0;
            i < validEvidence.length;
            i += 2
        ) {

            const page = createPDFPage(
                "SWATCH & EVIDENCE PHOTOS",
                `Customer: ${customer} | PI No: ${pi}`
            );

            const section = document.createElement("section");

            section.className = "pdf-section";

            const heading = document.createElement("div");

            heading.className = "pdf-section-title";
            heading.textContent = "EVIDENCE PHOTOS";

            const grid = document.createElement("div");

            grid.className = "pdf-evidence-grid";

            grid.appendChild(
                makeEvidenceCard(validEvidence[i], i)
            );

            if (validEvidence[i + 1]) {

                grid.appendChild(
                    makeEvidenceCard(
                        validEvidence[i + 1],
                        i + 1
                    )
                );
            }

            section.appendChild(heading);
            section.appendChild(grid);

            page.querySelector(".pdf-content")
                .appendChild(section);
        }
    }


    const pages = Array.from(
        workspace.querySelectorAll(".pdf-page")
    );

    pages.forEach((page, index) => {

        setPDFPageNumber(
            page,
            index + 1,
            pages.length
        );
    });


    await Promise.all(
        Array.from(
            workspace.querySelectorAll("img")
        ).map(waitForImage)
    );


    return pages;
}


/* =========================================
   DOWNLOAD PDF
========================================= */

async function downloadReportPDF(report, button) {

    button.disabled = true;
    button.textContent = "Preparing PDF...";

    setStatus(
        "PDF তৈরি হচ্ছে। অনুগ্রহ করে অপেক্ষা করুন..."
    );

    try {

        if (!window.html2canvas || !window.jspdf) {

            throw new Error(
                "PDF library লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।"
            );
        }


        const pages = await buildPDFPages(report);

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4",
            compress: true
        });


        for (let i = 0; i < pages.length; i++) {

            setStatus(
                `PDF তৈরি হচ্ছে: পেজ ${i + 1} / ${pages.length}`
            );

            const canvas = await html2canvas(
                pages[i],
                {
                    scale: 1.5,
                    useCORS: true,
                    backgroundColor: "#ffffff",
                    logging: false,
                    width: 794,
                    height: 1123,
                    windowWidth: 794
                }
            );


            const imageData = canvas.toDataURL(
                "image/jpeg",
                0.88
            );


            if (i > 0) {
                pdf.addPage("a4", "portrait");
            }


            pdf.addImage(
                imageData,
                "JPEG",
                0,
                0,
                210,
                297,
                undefined,
                "FAST"
            );


            canvas.width = 1;
            canvas.height = 1;
        }


        pdf.save(
            `Shade_Update_${customerFilename(getCustomer(report))}_` +
            `${customerFilename(getPI(report))}.pdf`
        );


        setStatus("PDF ডাউনলোড শুরু হয়েছে।");


    } catch (error) {

        console.error("PDF error:", error);

        setStatus(
            "PDF তৈরি করা যায়নি: " +
            (error.message || "Unknown error"),
            true
        );

        alert(
            "PDF তৈরি করতে সমস্যা হয়েছে:\n" +
            (error.message || "Unknown error")
        );

    } finally {

        $("pdfWorkspace").innerHTML = "";

        button.disabled = false;
        button.textContent = "⬇ Download PDF";
    }
}


function customerFilename(value) {

    return String(value || "Report")
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\s+/g, "_")
        .slice(0, 45);
}

/* =========================================
   PDF BUTTON EVENTS
========================================= */

$("reportList").addEventListener(
    "click",
    async function(event) {

        const button = event.target.closest(".pdf-button");

        if (!button) return;

        const reportId = button.dataset.reportId;

        const report = filteredReports.find(
            item =>
                String(item.id ?? "") === String(reportId)
        );

        if (!report) {

            alert("রিপোর্টটি পাওয়া যায়নি।");

            return;
        }

        await downloadReportPDF(report, button);
    }
);

   APPLICATION START
========================================= */

(async function init() {

    try {

        const loggedIn = await checkLogin();

        if (loggedIn) {
            await loadReports();
        }

    } catch (error) {

        console.error(
            "Application startup error:",
            error
        );

        setStatus(
            "অ্যাপ চালু করতে সমস্যা হয়েছে: " +
            (error.message || "Unknown error"),
            true
        );

        $("reportList").innerHTML =
            '<div class="no-data">' +
            'অ্যাপ চালু করা যায়নি।<br><br>' +
            escapeHTML(
                error.message || "Unknown error"
            ) +
            '</div>';
    }

})();
</script>
