<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#092b3b"><title>CHORKA TEXTILE LTD. | LAB SYSTEM</title><link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml"><style>
:root {
  --navy: #071e30;
  --navy2: #0c3548;
  --teal: #08a795;
  --mint: #80f2d8;
  --white: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Noto Sans Bengali", sans-serif;
  background: var(--navy);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-x: hidden;
  position: relative;
}

/* Animated corporate background */

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  background:
    radial-gradient(ellipse at 15% 15%, #124e61 0%, transparent 42%),
    radial-gradient(ellipse at 85% 85%, #075c59 0%, transparent 40%),
    linear-gradient(135deg, #061927, #0b2c40 55%, #071e30);
}

.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(128,242,216,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(128,242,216,.035) 1px, transparent 1px);
  background-size: 38px 38px;
  mask-image: linear-gradient(to bottom, black, transparent);
}

.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(75px);
  opacity: .27;
  animation: float 10s ease-in-out infinite alternate;
}

.glow.one {
  background: #00bfa5;
  top: -100px;
  left: -100px;
}

.glow.two {
  background: #1676b8;
  bottom: -120px;
  right: -100px;
  animation-delay: -4s;
}

.glow.three {
  width: 180px;
  height: 180px;
  background: #0b8e7d;
  top: 40%;
  right: -100px;
  animation-delay: -6s;
}

@keyframes float {
  from {
    transform: translate(0, 0) scale(1);
  }
  to {
    transform: translate(35px, -30px) scale(1.18);
  }
}

/* Floating particles */

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #80f2d8;
  border-radius: 50%;
  opacity: .45;
  animation: rise linear infinite;
}

.particle:nth-child(1) {
  left: 12%;
  bottom: -10px;
  animation-duration: 13s;
}

.particle:nth-child(2) {
  left: 32%;
  bottom: -10px;
  animation-duration: 17s;
  animation-delay: -5s;
}

.particle:nth-child(3) {
  left: 57%;
  bottom: -10px;
  animation-duration: 15s;
  animation-delay: -8s;
}

.particle:nth-child(4) {
  left: 78%;
  bottom: -10px;
  animation-duration: 19s;
  animation-delay: -3s;
}

.particle:nth-child(5) {
  left: 91%;
  bottom: -10px;
  animation-duration: 14s;
  animation-delay: -7s;
}

@keyframes rise {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  15% {
    opacity: .5;
  }
  85% {
    opacity: .3;
  }
  100% {
    transform: translateY(-110vh) translateX(45px);
    opacity: 0;
  }
}

/* Main content */

.container {
  width: 100%;
  max-width: 410px;
  position: relative;
  z-index: 2;
  animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Brand */

.brand {
  text-align: center;
  margin-bottom: 27px;
}

.logo {
  width: 79px;
  height: 79px;
  margin: 0 auto 17px;
  border-radius: 24px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;
  color: white;
  background: linear-gradient(145deg, #087d7a, #123e57);
  border: 1px solid rgba(128,242,216,.55);
  box-shadow:
    0 0 0 7px rgba(8,167,149,.08),
    0 15px 40px rgba(0,0,0,.25);
  animation: logoPulse 4s ease-in-out infinite;
}

.logo::before {
  content: "";
  position: absolute;
  inset: -7px;
  border: 1px solid rgba(128,242,216,.25);
  border-radius: 29px;
  animation: ring 4s ease-in-out infinite;
}

@keyframes logoPulse {
  0%, 100% {
    box-shadow: 0 0 0 7px rgba(8,167,149,.08),
      0 15px 40px rgba(0,0,0,.25);
  }
  50% {
    box-shadow: 0 0 0 11px rgba(8,167,149,.05),
      0 0 35px rgba(8,167,149,.2);
  }
}

@keyframes ring {
  0%, 100% {
    transform: scale(1);
    opacity: .8;
  }
  50% {
    transform: scale(1.07);
    opacity: .35;
  }
}

.company {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: .7px;
  line-height: 1.5;
  text-shadow: 0 2px 20px rgba(0,0,0,.2);
}

.company-sub {
  margin-top: 7px;
  color: #8fb8c5;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* Login card */

.card {
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.105),
    rgba(255,255,255,.045)
  );
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 27px;
  padding: 28px 24px 25px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.1);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  height: 2px;
  left: 12%;
  right: 12%;
  top: 0;
  background: linear-gradient(
    90deg,
    transparent,
    #80f2d8,
    #08a795,
    transparent
  );
  opacity: .9;
}

.access {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 11px;
  border-radius: 50px;
  background: rgba(8,167,149,.12);
  border: 1px solid rgba(128,242,216,.22);
  color: #9cf5df;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin-bottom: 20px;
}

.access-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #6ef0c8;
  box-shadow: 0 0 12px #6ef0c8;
  animation: blink 2s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .35; }
}

.heading {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -.5px;
  color: #fff;
  margin-bottom: 9px;
}

.description {
  font-size: 12px;
  line-height: 1.9;
  color: #a4c0ca;
  margin-bottom: 25px;
}

/* Form */

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 12px;
  font-weight: 800;
  color: #d3e7ec;
}

.input-wrap {
  position: relative;
}

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 19px;
  height: 19px;
  color: #80c6c8;
  pointer-events: none;
}

.input-wrap input {
  width: 100%;
  height: 54px;
  border-radius: 13px;
  border: 1px solid rgba(174,216,225,.19);
  outline: none;
  background: rgba(2,19,31,.4);
  color: white;
  padding: 0 45px;
  font-family: inherit;
  font-size: 13px;
  transition: .25s ease;
}

.input-wrap input::placeholder {
  color: #72929f;
}

.input-wrap input:focus {
  border-color: #32cbb3;
  background: rgba(2,19,31,.65);
  box-shadow: 0 0 0 4px rgba(8,167,149,.1);
}

.toggle-password {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #80f2d8;
  font-size: 11px;
  font-weight: 800;
  padding: 9px 3px;
  cursor: pointer;
}

/* Button */

.login-button {
  width: 100%;
  height: 55px;
  margin-top: 7px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 14px;
  background: linear-gradient(105deg, #087d79, #08a795);
  color: white;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(8,167,149,.2);
  transition: transform .2s, box-shadow .2s;
}

.login-button:active {
  transform: scale(.98);
}

.login-button:hover {
  box-shadow: 0 12px 35px rgba(8,167,149,.32);
}

.login-button:disabled {
  opacity: .65;
  cursor: wait;
}

.arrow {
  font-size: 20px;
  font-weight: 400;
}

/* Status message */

#message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 11px;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

/* Security and footer */

.security {
  margin-top: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  color: #8baeb9;
  font-size: 11px;
}

.security svg {
  width: 16px;
  height: 16px;
  color: #68e4c8;
}

.footer {
  margin-top: 23px;
  text-align: center;
  color: #7899a5;
  font-size: 10px;
  line-height: 1.9;
  letter-spacing: .5px;
}

.footer strong {
  color: #b1d0d9;
}

@media (max-width: 370px) {
  body {
    padding: 17px;
  }

  .card {
    padding: 24px 18px;
  }

  .company {
    font-size: 18px;
  }

  .heading {
    font-size: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}

  </footer></main><!-- Supabase Library --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><!-- Existing authentication system --><script src="./app.js"></script><!-- Password visibility --><script>
(function () {
  const password = document.getElementById("password");
  const toggle = document.getElementById("togglePassword");

  if (password && toggle) {
    toggle.addEventListener("click", function () {
      const hidden = password.type === "password";

      password.type = hidden ? "text" : "password";
      toggle.textContent = hidden ? "লুকান" : "দেখুন";
    });
  }
})();
